<!DOCTYPE html>
<html lang="en" class="scroll-smooth antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4AM Global Media | Engineering Tomorrow</title>
    <meta name="description"
        content="We build digital systems that look premium, scale reliably, and deliver measurable growth. Strategy, design, engineering, and talent acceleration in one execution team.">
    <meta name="theme-color" content="#030303">
    <meta name="google-site-verification" content="aXj2fD-1BBe7MPoguRkK_NU84RU-S7CjmROUaUdpBbY" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem('theme');
                    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
                    var root = document.documentElement;
                    root.classList.remove('light', 'dark');
                    root.classList.add(theme);
                    root.setAttribute('data-theme', theme);
                    root.style.colorScheme = theme;
                } catch (_) {}
            })();
        </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>

</html>
